;  PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:attiny85]
platform = atmelavr
board = attiny85
framework = arduino
; Set CPU clock to 16 MHz as per 8BitMixtape hardware configuration
board_build.f_cpu = 16000000L

; Mirror Arduino boards.txt preprocessor defines
build_flags =
  -DF_CPU=16000000L
  -DARDUINO_AVR_ATTINYX5
  -DCLOCK_SOURCE=8

; Library dependencies
lib_deps =
  OneWire
  adafruit/Adafruit NeoPixel

; Post-build: convert firmware.hex -> firmware.wav for 8BitMixtape/TinyAudioBoot
extra_scripts =
  scripts/hex2wav_post.py

; Configure the hex2wav command. Use {hex} and {wav} placeholders.
; Examples:
; hex2wav_cmd = node /absolute/path/to/hex2wav.js --in {hex} --out {wav}
; hex2wav_cmd = python3 /absolute/path/to/hex2wav.py -i {hex} -o {wav}
; hex2wav_cmd = java -jar /absolute/path/to/TinyAudioBoot.jar -i {hex} -o {wav}
; Use the local 64-bit binary directly so it plays audio
hex2wav_cmd = tools/hex2wav/linux/hex2wav64_bin {hex} {wav}

; Auto-play options (Linux defaults)
; Disable here to avoid double playback during normal build; upload will handle playback
hex2wav_auto_play = yes
hex2wav_player_cmd = aplay -q {wav}

; Fuse bytes from your Arduino menu (Arduino Core 16MHz (PLL/NO.BOD)) for reference:
; low_fuses = 0xE1
; high_fuses = 0xDD
; extended_fuses = 0xFE
; Note: PlatformIO will NOT change fuses unless you upload via ISP and configure upload flags.

; Uncomment and set your programmer if you are flashing via ISP (examples):
; upload_protocol = usbasp
; upload_protocol = stk500v1
; upload_flags = -P/dev/ttyUSB0 -b19200  ; for Arduino as ISP on serial

; Use the Upload button/icon for audio upload via hex2wav
upload_protocol = custom
; Build will run first (producing $SOURCE = firmware.hex). Then we convert and play it.
upload_command = tools/hex2wav/linux/hex2wav64_bin $SOURCE .pio/build/${PIOENV}/${PROGNAME}.wav && aplay -q .pio/build/${PIOENV}/${PROGNAME}.wav
